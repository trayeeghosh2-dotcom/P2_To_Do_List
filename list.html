<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trayee's To-Do List</title>

<style>

/* GENERAL STYLING */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eaf2ff, #dceaff);
    min-height: 100vh;
    color: #24364d;
    padding: 30px 15px;
}

.container {
    max-width: 750px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 36px;
    color: #12345b;
    margin-bottom: 8px;
}

.header h1 span {
    color: #1765d1;
}

.header p {
    color: #66778c;
    font-size: 15px;
}

/* MAIN CARD */

.todo-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 12px 35px rgba(20, 55, 100, 0.12);
}

/* DATE */

.date-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 10px;
}

.date-box h2 {
    font-size: 22px;
    color: #12345b;
}

.date-box span {
    color: #1765d1;
    font-size: 14px;
    font-weight: 600;
}

/* INPUT AREA */

.input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.input-area input {
    flex: 1;
    padding: 14px;
    border: 2px solid #dce5f2;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
    min-width: 0;
}

.input-area input:focus {
    border-color: #1765d1;
}

.add-btn {
    padding: 13px 22px;
    background: #1765d1;
    color: white;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.3s;
}

.add-btn:hover {
    background: #102c52;
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
}

.stat-box {
    background: #edf4ff;
    padding: 18px 10px;
    text-align: center;
    border-radius: 12px;
}

.stat-box h3 {
    font-size: 25px;
    color: #1765d1;
}

.stat-box p {
    font-size: 13px;
    color: #64748b;
}

/* FILTER BUTTONS */

.filter-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
}

.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter-btn {
    border: 1px solid #dce5f2;
    background: white;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    color: #53677e;
    font-size: 13px;
    transition: 0.3s;
}

.filter-btn:hover,
.filter-btn.active {
    background: #1765d1;
    color: white;
    border-color: #1765d1;
}

.clear-btn {
    background: transparent;
    color: #e05252;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.clear-btn:hover {
    text-decoration: underline;
}

/* TASK LIST */

.task-list {
    list-style: none;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px;
    border: 1px solid #e7edf5;
    border-radius: 10px;
    margin-bottom: 12px;
    transition: 0.3s;
    animation: fadeIn 0.3s ease;
}

.task-item:hover {
    background: #f8faff;
    border-color: #c5d9f5;
}

.task-checkbox {
    width: 19px;
    height: 19px;
    cursor: pointer;
    accent-color: #1765d1;
    flex-shrink: 0;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-text {
    font-size: 15px;
    color: #26364b;
    overflow-wrap: anywhere;
}

.task-date {
    display: block;
    color: #9aa6b5;
    font-size: 11px;
    margin-top: 4px;
}

.task-item.completed .task-text {
    text-decoration: line-through;
    color: #a0aab8;
}

.delete-btn {
    border: none;
    background: #fff0f0;
    color: #e05252;
    padding: 8px 11px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: 0.3s;
}

.delete-btn:hover {
    background: #e05252;
    color: white;
}

/* EMPTY MESSAGE */

.empty-message {
    text-align: center;
    padding: 35px 10px;
    color: #94a3b8;
}

.empty-message .emoji {
    font-size: 45px;
    margin-bottom: 10px;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 25px;
    color: #718096;
    font-size: 13px;
}

/* ANIMATION */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE DESIGN */

@media(max-width: 550px) {

    body {
        padding: 20px 12px;
    }

    .header h1 {
        font-size: 29px;
    }

    .todo-card {
        padding: 20px 15px;
    }

    .input-area {
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .stat-box h3 {
        font-size: 21px;
    }

    .filter-area {
        align-items: flex-start;
    }

    .task-item {
        gap: 9px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>My <span>To-Do List</span> 📝</h1>

        <p>Organize your tasks. Manage your time. Achieve your goals!</p>

    </div>


    <!-- MAIN TODO CARD -->

    <div class="todo-card">

        <!-- DATE -->

        <div class="date-box">

            <h2>My Daily Tasks</h2>

            <span id="currentDate"></span>

        </div>


        <!-- TASK INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your new task..."
                maxlength="150"
                autocomplete="off"
            >

            <button class="add-btn" id="addBtn">
                + Add Task
            </button>

        </div>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-box">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h3 id="activeTasks">0</h3>
                <p>Active Tasks</p>
            </div>

            <div class="stat-box">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

        </div>


        <!-- FILTERS -->

        <div class="filter-area">

            <div class="filters">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="active">
                    Active
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>

            </div>

            <button class="clear-btn" id="clearCompleted">
                Clear Completed
            </button>

        </div>


        <!-- TASK LIST -->

        <ul class="task-list" id="taskList">

        </ul>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <p>Made with ❤️ by Trayee Ghosh</p>

        <p>© <span id="year"></span> All Rights Reserved.</p>

        <p>Your tasks are saved automatically in your browser.</p>

    </div>

</div>


<script>

/* ==================================
   1. SELECT HTML ELEMENTS
================================== */

const taskInput = document.getElementById("taskInput");

const addBtn = document.getElementById("addBtn");

const taskList = document.getElementById("taskList");

const totalTasks = document.getElementById("totalTasks");

const activeTasks = document.getElementById("activeTasks");

const completedTasks = document.getElementById("completedTasks");

const clearCompleted = document.getElementById("clearCompleted");


/* ==================================
   2. LOAD TASKS FROM LOCAL STORAGE
================================== */

let tasks = [];

try {

    const savedTasks = localStorage.getItem("trayeeTodoTasks");

    tasks = savedTasks ? JSON.parse(savedTasks) : [];

    if (!Array.isArray(tasks)) {
        tasks = [];
    }

} catch (error) {

    tasks = [];

}


let currentFilter = "all";


/* ==================================
   3. DISPLAY CURRENT DATE
================================== */

const currentDate = document.getElementById("currentDate");

currentDate.textContent = new Date().toLocaleDateString(
    "en-IN",
    {
        day: "numeric",
        month: "long",
        year: "numeric"
    }
);


/* ==================================
   4. DISPLAY COPYRIGHT YEAR
================================== */

document.getElementById("year").textContent =
    new Date().getFullYear();


/* ==================================
   5. SAVE TASKS IN LOCAL STORAGE
================================== */

function saveTasks() {

    localStorage.setItem(
        "trayeeTodoTasks",
        JSON.stringify(tasks)
    );

}


/* ==================================
   6. ADD NEW TASK
================================== */

function addTask() {

    const taskName = taskInput.value.trim();

    if (taskName === "") {

        alert("Please enter a task!");

        taskInput.focus();

        return;

    }

    const newTask = {

        id: Date.now().toString() + Math.random(),

        text: taskName,

        completed: false,

        date: new Date().toLocaleString()

    };

    tasks.push(newTask);

    saveTasks();

    taskInput.value = "";

    taskInput.focus();

    renderTasks();

}


// ADD BUTTON EVENT

addBtn.addEventListener("click", addTask);


// ENTER KEY EVENT

taskInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        addTask();

    }

});


/* ==================================
   7. MARK TASK AS COMPLETED
================================== */

function toggleTask(id) {

    tasks = tasks.map(function(task) {

        if (task.id === id) {

            task.completed = !task.completed;

        }

        return task;

    });

    saveTasks();

    renderTasks();

}


/* ==================================
   8. DELETE TASK
================================== */

function deleteTask(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this task?"
    );

    if (!confirmDelete) {
        return;
    }

    tasks = tasks.filter(function(task) {

        return task.id !== id;

    });

    saveTasks();

    renderTasks();

}


/* ==================================
   9. FILTER TASKS
================================== */

function filterTasks(filter) {

    currentFilter = filter;

    document.querySelectorAll(".filter-btn").forEach(
        function(button) {

            button.classList.toggle(
                "active",
                button.dataset.filter === filter
            );

        }
    );

    renderTasks();

}


// FILTER BUTTON EVENTS

document.querySelectorAll(".filter-btn").forEach(
    function(button) {

        button.addEventListener("click", function() {

            filterTasks(button.dataset.filter);

        });

    }
);


/* ==================================
   10. CLEAR COMPLETED TASKS
================================== */

clearCompleted.addEventListener("click", function() {

    const completedCount = tasks.filter(
        function(task) {
            return task.completed;
        }
    ).length;

    if (completedCount === 0) {

        alert("There are no completed tasks to clear!");

        return;

    }

    const confirmClear = confirm(
        "Delete all completed tasks?"
    );

    if (!confirmClear) {
        return;
    }

    tasks = tasks.filter(function(task) {

        return !task.completed;

    });

    saveTasks();

    renderTasks();

});


/* ==================================
   11. UPDATE TASK STATISTICS
================================== */

function updateStats() {

    const total = tasks.length;

    const completed = tasks.filter(
        function(task) {
            return task.completed;
        }
    ).length;

    const active = total - completed;

    totalTasks.textContent = total;

    activeTasks.textContent = active;

    completedTasks.textContent = completed;

}


/* ==================================
   12. DISPLAY TASKS ON THE PAGE
================================== */

function renderTasks() {

    taskList.innerHTML = "";

    updateStats();

    let filteredTasks = tasks.filter(function(task) {

        if (currentFilter === "active") {

            return !task.completed;

        }

        if (currentFilter === "completed") {

            return task.completed;

        }

        return true;

    });


    // EMPTY MESSAGE

    if (filteredTasks.length === 0) {

        const emptyItem = document.createElement("li");

        emptyItem.className = "empty-message";

        const emoji = document.createElement("div");

        emoji.className = "emoji";

        emoji.textContent = "📋";

        const message = document.createElement("p");

        message.textContent =
            currentFilter === "completed"
            ? "No completed tasks yet!"
            : currentFilter === "active"
            ? "No active tasks! Great work."
            : "No tasks yet. Add your first task!";

        emptyItem.appendChild(emoji);

        emptyItem.appendChild(message);

        taskList.appendChild(emptyItem);

        return;

    }


    // CREATE EACH TASK

    filteredTasks.forEach(function(task) {

        const li = document.createElement("li");

        li.className = "task-item";

        if (task.completed) {

            li.classList.add("completed");

        }


        // CHECKBOX

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className = "task-checkbox";

        checkbox.checked = task.completed;

        checkbox.setAttribute(
            "aria-label",
            "Mark task as completed"
        );

        checkbox.addEventListener("change", function() {

            toggleTask(task.id);

        });


        // TASK CONTENT

        const content = document.createElement("div");

        content.className = "task-content";

        const taskText = document.createElement("span");

        taskText.className = "task-text";

        taskText.textContent = task.text;

        const date = document.createElement("small");

        date.className = "task-date";

        date.textContent = "Added: " + task.date;

        content.appendChild(taskText);

        content.appendChild(date);


        // DELETE BUTTON

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-btn";

        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function() {

            deleteTask(task.id);

        });


        // ADD ELEMENTS

        li.appendChild(checkbox);

        li.appendChild(content);

        li.appendChild(deleteButton);

        taskList.appendChild(li);

    });

}


/* ==================================
   13. INITIAL PAGE RENDERING
================================== */

renderTasks();

</script>

</body>
</html>
